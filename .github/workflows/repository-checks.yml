name: repository-checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  repository-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show repository structure
        run: |
          echo "Repository root:"
          pwd
          echo "Top-level files and folders:"
          find . -maxdepth 2 -type f | sort | head -200
          find . -maxdepth 2 -type d | sort | head -100

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check required repository files
        run: |
          test -f README.md
          test -f CITATION.cff
          test -f .zenodo.json
          test -f CODE_AVAILABILITY.md
          test -f LICENSE
          test -d R
          test -d python
          test -d docs
          test -d data
          test -d environment
          test -d tools

      - name: Run repository validation
        run: |
          python tools/validate_repository.py

      - name: Compile Python files
        run: |
          python -m compileall python tools
